[project]
name = "darsyar-backend"
version = "0.1.0"
description = "Darsyar AI educational assistant backend"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.162.0,<0.163.0",
  "uvicorn[standard]>=0.38.0,<1.0.0",
  "pydantic>=2.12,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "python-dotenv>=1.1,<2.0",
  "sqlalchemy[asyncio]>=2.0.0,<2.1.0",
  "asyncpg>=0.30.0,<1.0.0",
  "alembic>=1.16.0,<2.0.0",
  "pgvector>=0.4.0,<1.0.0",
  "redis[hiredis]>=5.0.0,<6.0.0",
  "arq>=0.27.0,<1.0.0",
  "httpx>=0.28.0,<1.0.0",
  "sse-starlette>=3.0.0,<4.0.0",
  "slowapi>=0.1.9,<1.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "email-validator>=2.2.0,<3.0.0",
  "argon2-cffi>=25.0.0,<26.0.0",
  "PyJWT[crypto]>=2.10.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.2,<2.0",
  "pytest-cov>=6.2,<8.0",
  "respx>=0.22,<1.0",
  "ruff>=0.14,<0.15",
  "mypy>=1.18,<2.0",
  "testcontainers[postgres]>=4.13,<5.0",
]
rag = [
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-postgres>=3.0,<4.0",
  "langchain-openai>=1.0,<2.0",
  "sentence-transformers>=5.0,<6.0",
  "FlagEmbedding>=1.3,<2.0",
  "pypdf>=6.0,<7.0",
  "python-docx>=1.2,<2.0",
  "beautifulsoup4>=4.14,<5.0",
  "trafilatura>=2.0,<3.0",
  "Pillow>=12.0,<13.0",
  "filetype>=1.2,<2.0",
  "pytesseract>=0.3.13,<1.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
mypy_path = "."
exclude = ["alembic/versions"]
