events { worker_connections 1024; }
http {
  server_tokens off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream darsyar_api { server api:8000; }

  # One default server: static SPA + same-origin API. Two servers on the same
  # port made the static block unreachable because only the first one is default.
  server {
    listen 8080;
    server_name _;
    return 308 https://$host$request_uri;
  }

  server {
    listen 8443 ssl;
    http2 on;
    server_name REPLACE_WITH_REAL_DOMAIN;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;
    client_max_body_size 20m;

    # HSTS only on the TLS server; max-age must be raised after cert renewal is proven.
    add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    TLS template only: replace domain/cert paths, verify renewal, then raise HSTS max-age and review CSP for the real app.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self';" always;

    # /metrics must never be publicly reachable; only an internal scraper may read it.
    location = /metrics { deny all; }
    location = /api/metrics { deny all; }

    location /api/ {
      proxy_pass http://darsyar_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Overwrite XFF with the trusted neighbour address so clients cannot spoof it.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Location-level add_header suppresses inherited server headers; repeat them.
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self';" always;
      add_header Cache-Control "no-store" always;
      proxy_buffering off;
      proxy_read_timeout 360s;
      proxy_send_timeout 360s;
      proxy_set_header Connection "";
      add_header X-Accel-Buffering "no" always;
    }

    # The SPA entrypoint contains the runtime shell; never store it.
    location = /index.html {
      try_files $uri =404;
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "DENY" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self';" always;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
