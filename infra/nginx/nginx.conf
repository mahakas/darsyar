events { worker_connections 1024; }
http {
  server_tokens off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream darsyar_api { server api:8000; }
  upstream darsyar_frontend { server frontend:5173; }
  server {
    listen 8080;
    client_max_body_size 20m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Production TLS/HSTS and final CSP must be configured and tested for the actual domain.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self';" always;

    location /api/ {
      proxy_pass http://darsyar_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Repeat headers: a location-level add_header can otherwise suppress server-level headers.
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self';" always;
      proxy_buffering off;
      proxy_read_timeout 360s;
      proxy_send_timeout 360s;
      proxy_set_header Connection "";
      add_header X-Accel-Buffering "no" always;
    }
    location / {
      proxy_pass http://darsyar_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
