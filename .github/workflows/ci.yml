name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-bookworm
        env:
          POSTGRES_DB: darsyar_test
          POSTGRES_USER: darsyar
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U darsyar -d darsyar_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.12-bookworm
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify lockfile exists
        run: test -s backend/uv.lock
      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --locked --extra dev
      - name: Alembic migration smoke
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://darsyar:ci-only-password@localhost:5432/darsyar_test
        run: uv run --locked alembic upgrade head
      - name: Ruff
        working-directory: backend
        run: uv run --locked ruff check .
      - name: Mypy backend
        working-directory: backend
        run: uv run --locked mypy app
      - name: Unit and PostgreSQL integration tests
        working-directory: backend
        env:
          APP_ENV: test
          # Fixed test-only secrets; never reuse in development or production.
          APP_SECRET_KEY: "ci-only-signing-secret-never-use-outside-tests-39"
          OTP_PEPPER: "ci-only-otp-pepper-never-use-outside-tests-39"
          OTP_PEPPER_ID: "v1"
          DATABASE_URL: postgresql+asyncpg://darsyar:ci-only-password@localhost:5432/darsyar_test
          TEST_DATABASE_URL: postgresql+asyncpg://darsyar:ci-only-password@localhost:5432/darsyar_test
          DARSYAR_TEST_DB: "1"
          REDIS_URL: redis://localhost:6379/0
        run: uv run --locked pytest -q
      - name: RAG evaluation (only after golden set exists)
        if: ${{ hashFiles('backend/tests/evaluation/golden_set.jsonl') != '' }}
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://darsyar:ci-only-password@localhost:5432/darsyar_test
        run: uv run --locked python -m app.services.retrieval.evaluation

  sigterm-linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18-bookworm
        env:
          POSTGRES_DB: darsyar_test
          POSTGRES_USER: darsyar
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U darsyar -d darsyar_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.12-bookworm
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --locked --extra dev
      - name: Alembic migration
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://darsyar:ci-only-password@localhost:5432/darsyar_test
        run: uv run --locked alembic upgrade head
      - name: Phase 3 Linux SIGTERM acceptance (open SSE + financial finalization)
        working-directory: backend
        env:
          APP_ENV: test
          APP_SECRET_KEY: "ci-only-signing-secret-never-use-outside-tests-39"
          OTP_PEPPER: "ci-only-otp-pepper-never-use-outside-tests-39"
          OTP_PEPPER_ID: "v1"
          DATABASE_URL: postgresql+asyncpg://darsyar:ci-only-password@localhost:5432/darsyar_test
          TEST_DATABASE_URL: postgresql+asyncpg://darsyar:ci-only-password@localhost:5432/darsyar_test
          DARSYAR_TEST_DB: "1"
          REDIS_URL: redis://localhost:6379/0
        run: uv run --locked python scripts/phase3_sigterm_linux.py
      - name: Upload shutdown logs (on failure or always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sigterm-logs
          path: |
            backend/server_a_stdout.log
            backend/server_a_stderr.log
            backend/server_b_stdout.log
            backend/server_b_stderr.log
          if-no-files-found: warn
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify lockfile exists
        run: test -s frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  nginx-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate reverse-proxy Nginx configuration
        run: |
          docker run --rm \
            --add-host api:127.0.0.1 --add-host frontend:127.0.0.1 \
            -v "${GITHUB_WORKSPACE}/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.28-alpine nginx -t
      - name: Smoke-test production frontend security headers
        shell: bash
        run: |
          docker run -d --rm --name darsyar-frontend-nginx \
            -p 127.0.0.1:18080:8080 \
            -v "${GITHUB_WORKSPACE}/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.28-alpine
          trap 'docker rm -f darsyar-frontend-nginx >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsSI http://127.0.0.1:18080/ >/dev/null; then break; fi
            sleep 0.5
          done
          headers="$(curl -fsSI http://127.0.0.1:18080/)"
          printf '%s\n' "$headers"
          grep -Eqi '^X-Content-Type-Options:[[:space:]]*nosniff' <<<"$headers"
          grep -Eqi '^X-Frame-Options:[[:space:]]*DENY' <<<"$headers"
          grep -Eqi '^Referrer-Policy:[[:space:]]*strict-origin-when-cross-origin' <<<"$headers"
          grep -Eqi '^Cache-Control:[[:space:]]*no-store' <<<"$headers"
          grep -Eqi "Content-Security-Policy:.*frame-ancestors 'none'" <<<"$headers"

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Pull and resolve exact base-image digests
        id: images
        shell: bash
        run: |
          set -euo pipefail
          resolve_image() {
            local key="$1"
            local ref="$2"
            docker pull "$ref"
            local digest
            digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$ref")"
            if [[ "$digest" != *@sha256:* ]]; then
              echo "Could not resolve immutable digest for $ref" >&2
              exit 1
            fi
            printf '%s=%s\n' "$key" "$digest" >> "$GITHUB_OUTPUT"
            printf '%s => %s\n' "$ref" "$digest"
          }
          resolve_image pgvector 'pgvector/pgvector:0.8.7-pg18-bookworm'
          resolve_image redis 'redis:7.4.12-bookworm'
          resolve_image nginx 'nginx:1.28-alpine'
          resolve_image python 'python:3.13-slim'
          resolve_image node 'node:24-alpine'
      - name: Prepare report directory
        run: mkdir -p security-reports
      - name: Scan repository filesystem (vulnerabilities, misconfiguration and secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '0'
          format: json
          output: security-reports/filesystem.json
          timeout: 15m
      - name: Scan PostgreSQL/pgvector base image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: 'true'
          version: v0.76.2
          scan-type: image
          image-ref: ${{ steps.images.outputs.pgvector }}
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '0'
          format: json
          output: security-reports/pgvector.json
          timeout: 15m
      - name: Scan Redis base image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: 'true'
          version: v0.76.2
          scan-type: image
          image-ref: ${{ steps.images.outputs.redis }}
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '0'
          format: json
          output: security-reports/redis.json
          timeout: 15m
      - name: Scan Nginx base image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: 'true'
          version: v0.76.2
          scan-type: image
          image-ref: ${{ steps.images.outputs.nginx }}
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '0'
          format: json
          output: security-reports/nginx.json
          timeout: 15m
      - name: Scan Python runtime base image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: 'true'
          version: v0.76.2
          scan-type: image
          image-ref: ${{ steps.images.outputs.python }}
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '0'
          format: json
          output: security-reports/python.json
          timeout: 15m
      - name: Scan Node runtime base image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: 'true'
          version: v0.76.2
          scan-type: image
          image-ref: ${{ steps.images.outputs.node }}
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '0'
          format: json
          output: security-reports/node.json
          timeout: 15m
      - name: Upload Trivy reports and resolved image digests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-supply-chain-reports
          path: security-reports/*.json
          if-no-files-found: warn
          retention-days: 30

