name: Ingestion PDFium Linux Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingestion-pdfium-linux-preflight
  cancel-in-progress: false

env:
  IMAGE: python:3.13-slim
  PYPY_ARTIFACT: darsyar-pdfium-linux-preflight

jobs:
  linux-pdfium-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout (host only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare isolated temporary workspace
        run: |
          WORK_DIR="$RUNNER_TEMP/darsyar-pdfium-linux-preflight"
          mkdir -p "$WORK_DIR/output/rendered-pages" "$WORK_DIR/source" "$WORK_DIR/scripts" "$WORK_DIR/wheels"
          cp scripts/ci/pdfium_linux_preflight.py "$WORK_DIR/scripts/"
          # runner host inventory
          {
            echo "runner_os=$(uname -s)"
            echo "runner_arch=$(uname -m)"
            echo "runner_python=$(python3 --version 2>&1)"
            echo "runner_docker=$(docker --version 2>&1)"
          } > "$WORK_DIR/output/runner-host.json"
          echo "WORK_DIR=$WORK_DIR" >> "$GITHUB_ENV"

      - name: Pull and pin base image
        id: image
        run: |
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" > "$WORK_DIR/output/docker-image.json"
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' "$IMAGE")"
          echo "image_id=$IMAGE_ID" >> "$GITHUB_OUTPUT"

      - name: Run disposable PDFium runtime test
        id: test
        run: |
          IMAGE_ID="${{ steps.image.outputs.image_id }}"

          set +e

          docker run \
            --rm \
            --init \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 2g \
            --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m,mode=1777 \
            -e HOME=/tmp \
            -e PIP_NO_CACHE_DIR=1 \
            -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$WORK_DIR:/work" \
            -w /work \
            "$IMAGE_ID" \
            python /work/scripts/pdfium_linux_preflight.py 2>&1 \
            | tee "$WORK_DIR/output/container.log"

          pipeline_status=("${PIPESTATUS[@]}")

          set -e

          container_exit="${pipeline_status[0]:-1}"
          tee_exit="${pipeline_status[1]:-1}"

          echo "container_exit=$container_exit" >> "$GITHUB_OUTPUT"
          echo "tee_exit=$tee_exit" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PYPY_ARTIFACT }}
          path: ${{ runner.temp }}/darsyar-pdfium-linux-preflight/output
          retention-days: 7

      - name: Fail job for non-PASS outcome
        if: steps.test.outputs.container_exit != '0' || steps.test.outputs.tee_exit != '0'
        run: |
          echo "PDFium Linux preflight did not pass (container_exit=${{ steps.test.outputs.container_exit }}, tee_exit=${{ steps.test.outputs.tee_exit }})."
          exit 1
